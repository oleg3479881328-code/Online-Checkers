<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Checkers</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="game-card">
      <header class="game-header">
        <div>
          <p class="eyebrow">Local MVP</p>
          <h1>Online Checkers</h1>
          <p class="subtitle">You play red. Computer plays black.</p>
        </div>
        <button id="restartButton" class="restart-button" type="button">Restart game</button>
      </header>

      <section class="controls-panel">
        <label class="rules-control" for="rulesSelect">
          <span class="status-label">Rules</span>
          <select id="rulesSelect" class="rules-select">
            <option value="english">English checkers</option>
            <option value="russian">Russian checkers</option>
          </select>
        </label>
      </section>

      <section class="status-panel" aria-live="polite">
        <div class="status-item">
          <span class="status-label">Status</span>
          <strong id="statusText">Your move</strong>
        </div>
        <div class="status-item">
          <span class="status-label">Turn</span>
          <strong id="turnText">You</strong>
        </div>
      </section>

      <div class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="Checkers board"></div>
      </div>

      <footer class="game-footer">
        <p id="rulesHint">English rules: regular pieces move and capture forward. Kings move one square diagonally. Captures are mandatory.</p>
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
